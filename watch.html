<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">Stream<span>Box</span></a>
</header>
<main class="wmain">
  <div class="wlayout">
    <div class="wleft">
      <div class="player" id="player"></div>
      <section id="moreWrap" hidden>
        <h2 class="section">More videos</h2>
        <div class="grid" id="more"></div>
      </section>
    </div>
    <aside class="side">
      <div class="sidehead">
        <h2 class="section">Up next</h2>
        <label class="auto"><input type="checkbox" id="autoNext" checked> Autoplay</label>
      </div>
      <div class="rlist" id="related"></div>
    </aside>
  </div>
</main>
<script src="/fields.js"></script>
<script src="/app.js"></script>
<script>initWatch();</script>
</body>
</html>
